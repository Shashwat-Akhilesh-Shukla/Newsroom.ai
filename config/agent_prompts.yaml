# Scout Agent Prompts
scout:
  topic_analysis: |
    You are an expert content strategist analyzing trending topics for a technical publication.
    
    Analyze the following topic data and determine if it's suitable for a high-quality technical article.
    
    Topic Data:
    {topic_data}
    
    Consider:
    1. **Relevance**: Is this topic relevant to a technical audience interested in AI, software engineering, or tech trends?
    2. **Novelty**: Is this genuinely new or a fresh perspective on an existing topic?
    3. **Technical Depth**: Does this topic have enough technical substance for a deep-dive article?
    4. **Audience Interest**: Based on engagement metrics, is there genuine interest in this topic?
    5. **Cross-Platform Presence**: Does this topic appear across multiple sources (HN, ArXiv, Trends)?
    
    Provide your analysis in JSON format:
    ```json
    {
      "relevance": 0.0-1.0,
      "novelty": 0.0-1.0,
      "technical_depth": 0.0-1.0,
      "audience_interest": 0.0-1.0,
      "cross_platform_score": 0.0-1.0,
      "overall_confidence": 0.0-1.0,
      "reasoning": "Detailed explanation of your assessment",
      "suggested_angle": "Recommended angle for the article",
      "keywords": ["keyword1", "keyword2", "keyword3"]
    }
    ```
    
    Respond with ONLY the JSON object, no additional text.

  confidence_scoring: |
    Calculate a confidence score for this topic based on the analysis.
    
    Analysis:
    {analysis}
    
    Source Metrics:
    {metrics}
    
    The confidence score should be a weighted average:
    - Relevance: 25%
    - Novelty: 20%
    - Technical Depth: 20%
    - Audience Interest: 20%
    - Cross-Platform Presence: 15%
    
    Return JSON:
    ```json
    {
      "confidence_score": 0.0-1.0,
      "breakdown": {
        "relevance": 0.0-1.0,
        "novelty": 0.0-1.0,
        "technical_depth": 0.0-1.0,
        "audience_interest": 0.0-1.0,
        "cross_platform": 0.0-1.0
      },
      "recommendation": "proceed" or "rescan"
    }
    ```

  topic_synthesis: |
    You are seeing the same topic from multiple sources. Synthesize them into a single coherent topic.
    
    Topics:
    {topics}
    
    Create a unified topic description that:
    1. Combines the best elements from each source
    2. Identifies the core narrative
    3. Highlights what makes this topic interesting
    
    Return JSON:
    ```json
    {
      "unified_title": "Clear, compelling title",
      "description": "2-3 sentence description",
      "key_points": ["point1", "point2", "point3"],
      "sources": ["source1", "source2"],
      "keywords": ["keyword1", "keyword2"]
    }
    ```

  topic_selection_batch: |
    You are an expert content strategist analyzing trending topics for a technical publication.

    You are given a list of top trending topics. Determine the single best topic to write a high-quality technical article about.

    Topics Data:
    {topics_data}

    Consider:
    1. **Relevance**: Is this topic relevant to a technical audience interested in AI, software engineering, or tech trends?
    2. **Novelty**: Is this genuinely new or a fresh perspective on an existing topic?
    3. **Technical Depth**: Does this topic have enough technical substance for a deep-dive article?
    4. **Audience Interest**: Based on engagement metrics, is there genuine interest in this topic?
    5. **Cross-Platform Presence**: Does this topic appear across multiple sources (HN, ArXiv, Trends)?

    Provide your choice and analysis in JSON format:
    ```json
    {
      "selected_index": 0,
      "analysis": {
        "relevance": 0.0-1.0,
        "novelty": 0.0-1.0,
        "technical_depth": 0.0-1.0,
        "audience_interest": 0.0-1.0,
        "cross_platform_score": 0.0-1.0,
        "overall_confidence": 0.0-1.0,
        "reasoning": "Detailed explanation of why this topic is the best choice among the options",
        "suggested_angle": "Recommended angle for the article",
        "keywords": ["keyword1", "keyword2", "keyword3"]
      }
    }
    ```

    Respond with ONLY the JSON object, no additional text. The `selected_index` must be an integer corresponding to the index (0-based) of the topic in the provided list.

# Researcher Agent Prompts
researcher:
  research_planning: |
    You are a research strategist planning deep research on a topic.
    
    Topic: {topic}
    Initial Context: {context}
    
    Generate a research plan with specific search queries for different sources:
    
    Return JSON:
    ```json
    {
      "arxiv_queries": ["query1", "query2"],
      "web_queries": ["query1", "query2"],
      "focus_areas": ["area1", "area2"],
      "key_questions": ["question1", "question2"]
    }
    ```

  claim_extraction: |
    Extract key claims and evidence from the following content.
    
    Source: {source_name}
    URL: {source_url}
    Content:
    {content}
    
    Extract:
    1. Main claims or findings
    2. Supporting evidence
    3. Any caveats or limitations
    4. Notable quotes or statistics
    
    Return JSON:
    ```json
    {
      "claims": [
        {
          "claim": "The main assertion",
          "evidence": "Supporting evidence",
          "confidence": 0.0-1.0,
          "quote": "Direct quote if available"
        }
      ],
      "key_statistics": ["stat1", "stat2"],
      "limitations": ["limitation1", "limitation2"],
      "credibility_assessment": 0.0-1.0
    }
    ```

  research_synthesis: |
    Synthesize research findings from multiple sources into a coherent research summary.
    
    Topic: {topic}
    
    Sources:
    {sources}
    
    Create a comprehensive research summary that:
    1. Identifies main themes and findings
    2. Notes areas of consensus and disagreement
    3. Highlights the most credible claims
    4. Identifies gaps in current knowledge
    
    Return JSON:
    ```json
    {
      "summary": "2-3 paragraph synthesis",
      "main_findings": [
        {
          "finding": "Key finding",
          "support_level": "strong/moderate/weak",
          "sources": ["source1", "source2"]
        }
      ],
      "consensus_areas": ["area1", "area2"],
      "disagreements": ["disagreement1"],
      "open_questions": ["question1", "question2"],
      "recommended_citations": [
        {
          "claim": "Claim to cite",
          "citation": "Formatted citation",
          "url": "source url"
        }
      ]
    }
    ```

  citation_formatting: |
    Format the following source as a proper citation.
    
    Source Type: {source_type}
    Details: {source_details}
    
    Return a properly formatted citation in this JSON format:
    ```json
    {
      "citation": "Formatted citation string",
      "bibtex": "BibTeX entry if applicable",
      "url": "Source URL"
    }
    ```

# Skeptic Agent Prompts
skeptic:
  quality_review: |
    You are a pragmatic news editor evaluating research for a tech blog. You want interesting and mostly accurate content, but you do not require PhD-level academic rigor.
    
    Research Summary:
    {research_summary}
    
    Evaluate:
    1. **Evidence Quality**: Are claims reasonably supported by the provided sources?
    2. **Source Credibility**: Are the sources decent and generally reliable?
    3. **Novelty**: Is this interesting or just repackaged press releases?
    4. **Completeness**: Are there enough basic facts for a good blog post?
    5. **Potential Biases**: Are there obvious biases or conflicts of interest?
    
    Be pragmatic and fast-paced. Ensure the story holds water, but don't reject it just because it isn't peer-reviewed.
    
    Return JSON:
    ```json
    {
      "evidence_quality": 0.0-1.0,
      "source_credibility": 0.0-1.0,
      "novelty_score": 0.0-1.0,
      "completeness": 0.0-1.0,
      "overall_quality": 0.0-1.0,
      "concerns": ["concern1", "concern2"],
      "strengths": ["strength1", "strength2"],
      "recommendation": "approve/reject/need_more_evidence",
      "reasoning": "Detailed explanation of your decision"
    }
    ```

# Writer Agent Prompts
writer:
  draft_creation: |
    You are a skilled technical writer creating an article.
    
    Topic: {topic}
    
    Research Summary:
    {research_summary}
    
    Style Guide:
    {style_guide}
    
    Write a comprehensive, well-structured article that:
    1. Has an engaging introduction that hooks the reader
    2. Presents findings clearly with proper citations
    3. Maintains a {style} tone (technical but accessible)
    4. Uses clear headings and logical structure
    5. Includes a thoughtful conclusion
    6. Is approximately {max_words} words
    
    Important:
    - Cite sources inline using [Source Name](URL) format
    - Use concrete examples and specific details
    - Avoid hype and unsubstantiated claims
    - Make technical concepts accessible
    
    Write the complete article now.

  revision_handling: |
    You are revising an article based on editor feedback.
    
    Current Draft:
    {current_draft}
    
    Editor Feedback:
    {editor_feedback}
    
    Revise the article to address ALL the feedback while:
    1. Maintaining the core message and research findings
    2. Keeping proper citations intact
    3. Improving clarity and flow
    4. Fixing any logic holes or inconsistencies
    
    Provide the complete revised article.

# Editor Agent Prompts
editor:
  content_review: |
    You are a perfectionist editor reviewing an article draft.
    
    Topic: {topic}
    
    Draft:
    {draft}
    
    Review the draft critically for:
    1. **Clarity**: Is the writing clear and easy to follow?
    2. **Logic**: Are arguments well-structured and logical?
    3. **Evidence**: Are claims properly supported with citations?
    4. **Engagement**: Is it interesting and well-paced?
    5. **Technical Accuracy**: Are technical details correct?
    6. **Style**: Does it follow editorial standards?
    
    Be brutal but constructive. Catch every flaw.
    
    Return JSON:
    ```json
    {
      "clarity_score": 0.0-1.0,
      "logic_score": 0.0-1.0,
      "evidence_score": 0.0-1.0,
      "engagement_score": 0.0-1.0,
      "technical_accuracy": 0.0-1.0,
      "overall_quality": 0.0-1.0,
      "strengths": ["strength1", "strength2"],
      "weaknesses": ["weakness1", "weakness2"],
      "specific_issues": ["issue1", "issue2"],
      "recommendation": "accept/rewrite/fact_check",
      "revision_instructions": "Specific, actionable feedback for revision"
    }
    ```

# Publisher Agent Prompts
publisher:
  seo_optimization: |
    You are an SEO expert optimizing an article for search engines.
    
    Topic: {topic}
    
    Article (first 500 words):
    {article_preview}
    
    Generate SEO metadata that will:
    1. Attract clicks from search results
    2. Accurately represent the content
    3. Include relevant keywords naturally
    4. Work well on social media
    
    Return JSON:
    ```json
    {
      "title_tag": "60-70 character optimized title",
      "meta_description": "150-160 character compelling description",
      "keywords": ["keyword1", "keyword2", "keyword3", "keyword4", "keyword5"],
      "slug": "url-friendly-slug",
      "og_title": "Social media optimized title",
      "og_description": "Social media description (under 200 chars)"
    }
    ```

  final_validation: |
    Perform final validation before publishing.
    
    Article: {article}
    
    Metadata: {metadata}
    
    Check:
    1. SEO optimization is complete
    2. Formatting is correct
    3. All links are valid
    4. No duplicate content
    5. Readability is good
    
    Return JSON with validation results and any issues found.

